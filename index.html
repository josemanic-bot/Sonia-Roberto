function updateParallax(){for(const el of visibleParallax){if(reducedMotion.matches){el.style.translate='none';continue;}const box=el.closest('.pdf-spread').getBoundingClientRect();const progress=Math.max(-1,Math.min(1,(innerHeight/2-box.top-box.height/2)/(innerHeight/2+box.height/2)));const landscape=el.tagName==='IMG';const amount=landscape?14:(innerWidth<701?10:20);el.style.translate=`0 ${(progress*amount*(landscape?-1:1)).toFixed(2)}px`;}}
reducedMotion.addEventListener('change',()=>{parallaxTargets.forEach(el=>el.style.translate='none');updateParallax();});
function updateHero(){const travel=track.offsetHeight-innerHeight;const p=Math.max(0,Math.min(1,scrollY/Math.max(1,travel)));const eased=p*p*(3-2*p);heroPhoto.style.filter=`blur(${(15*(1-eased)).toFixed(2)}px)`;heroPhoto.style.transform=`scale(${1.06-.06*eased})`;heroTitle.style.opacity=Math.max(0,1-p*2.1);heroTitle.style.transform=`translateY(${-p*55}px)`;shade.style.opacity=1-eased;cue.style.opacity=Math.max(0,1-p*4);cue.style.visibility=p>.28?'hidden':'visible';readingProgress.style.transform=`scaleX(${Math.min(1,scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight))})`;updateParallax();scheduled=false;}
addEventListener('scroll',()=>{if(!scheduled){requestAnimationFrame(updateHero);scheduled=true;}},{passive:true});addEventListener('resize',updateHero);updateHero();
const audio=document.getElementById('audio'),music=document.getElementById('music'),musicLabel=music.querySelector('.music-text'),status=document.getElementById('audio-status');audio.volume=.65;
function musicState(){const playing=!audio.paused;music.classList.toggle('playing',playing);music.setAttribute('aria-pressed',String(playing));music.setAttribute('aria-label',playing?'Silenciar música':'Activar música: Nuvole Bianche, de Ludovico Einaudi');musicLabel.textContent=playing?'Silenciar':'Música';}
let autoMusicAttempted=false,manualMusicChoice=false;
async function startMusic(automatic=false){try{if(!audio.src)audio.src=JSON.parse(document.getElementById('audio-data').textContent);await audio.play();status.textContent='Suena Nuvole Bianche, de Ludovico Einaudi.';}catch(error){status.textContent=automatic?'El navegador requiere que pulses Música para escuchar la canción.':'No se pudo reproducir la canción. Pulsa Música para volver a intentarlo.';musicState();}}
function firstScrollMusic(){if(autoMusicAttempted||manualMusicChoice)return;autoMusicAttempted=true;startMusic(true);}
addEventListener('wheel',firstScrollMusic,{passive:true,once:true});
addEventListener('touchmove',firstScrollMusic,{passive:true,once:true});
addEventListener('scroll',()=>{if(scrollY>5)firstScrollMusic();},{passive:true});
addEventListener('keydown',event=>{if(['ArrowDown','PageDown',' ','End'].includes(event.key)&&!document.querySelector('#viewer').open)firstScrollMusic();});
music.addEventListener('click',()=>{manualMusicChoice=true;if(!audio.paused){audio.pause();return;}startMusic(false);});audio.addEventListener('play',musicState);audio.addEventListener('pause',musicState);
const viewer=document.getElementById('viewer'),viewerImage=document.getElementById('viewer-image'),count=document.getElementById('viewer-count'),download=document.getElementById('download');let current=0,lastFocus;
function showPhoto(i){current=(i+activePhotos.length)%activePhotos.length;viewerImage.src=photoURL(current);viewerImage.alt=`Sonia y Roberto, fotografía ${current+1} de ${activePhotos.length}`;count.textContent=`${String(current+1).padStart(3,'0')} / ${activePhotos.length}`;download.href=photoURL(current);download.download=`Sonia-Roberto-${String(current+1).padStart(3,'0')}.${activePhotos[current].src.startsWith('data:image/jpeg')||activePhotos[current].src.endsWith('.jpg')?'jpg':'webp'}`;}
function openViewer(i,trigger,mode='photo'){activePhotos=mode==='pdf'?pdfPhotos:photos;lastFocus=trigger;showPhoto(i);viewer.showModal();document.body.style.overflow='hidden';}
function closeViewer(){viewer.close();}
viewer.addEventListener('close',()=>{document.body.style.overflow='';lastFocus?.focus({preventScroll:true});});document.querySelector('.viewer-close').addEventListener('click',closeViewer);document.querySelector('.viewer-prev').addEventListener('click',()=>showPhoto(current-1));document.querySelector('.viewer-next').addEventListener('click',()=>showPhoto(current+1));
document.addEventListener('click',e=>{const b=e.target.closest('button[data-photo]');if(b)openViewer(Number(b.dataset.photo),b);const pb=e.target.closest('button[data-pdf-photo]');if(pb)openViewer(Number(pb.dataset.pdfPhoto),pb,'pdf');});
viewer.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();showPhoto(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();showPhoto(current-1);}});
let touchStart=null;viewerImage.addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});viewerImage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))showPhoto(current+(dx<0?1:-1));touchStart=null;},{passive:true});
const archive=document.getElementById('archive'),toggle=document.getElementById('archive-toggle');let archiveBuilt=false;
function setArchive(open){if(open&&!archiveBuilt){const fragment=document.createDocumentFragment();photos.forEach((p,i)=>{const b=document.createElement('button');b.className='photo';b.dataset.photo=i;b.setAttribute('aria-label',`Ampliar fotografía ${i+1}`);const img=document.createElement('img');img.dataset.image=i;img.loading='lazy';img.decoding='async';img.alt=`Sonia y Roberto · ${String(i+1).padStart(3,'0')}`;fillImage(img);b.append(img);fragment.append(b);});archive.querySelector('.archive-grid').append(fragment);archiveBuilt=true;}archive.hidden=!open;toggle.setAttribute('aria-expanded',String(open));toggle.innerHTML=open?'Cerrar galería <span aria-hidden="true">↑</span>':'Ver todas las fotografías <span aria-hidden="true">↗</span>';if(open)archive.scrollIntoView({behavior:'smooth'});}
toggle.addEventListener('click',()=>setArchive(archive.hidden));document.getElementById('archive-close').addEventListener('click',()=>{setArchive(false);toggle.scrollIntoView({block:'center'});toggle.focus({preventScroll:true});});
</script>
</body></html>
